[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treefleet"
version = "0.1.0"
description = "Parallel coding agents in isolated git worktrees: ADK orchestrator, CrewAI workers, A2A between them."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.2",
  "psutil>=5.9",
  "langfuse>=3",
  "opentelemetry-api",
  "opentelemetry-sdk",
]

# Two environments on purpose: ADK and CrewAI resolve and upgrade independently, and A2A means they never share a process.
#   uv venv .venv-orch   && uv pip install -p .venv-orch   -e ".[orchestrator,dev]"
#   uv venv .venv-worker && uv pip install -p .venv-worker -e ".[worker]"
[project.optional-dependencies]
orchestrator = [
  "google-adk>=2",
  "a2a-sdk==0.3.26",
  "litellm",
  "openinference-instrumentation-google-adk",
  "fastapi",
  "uvicorn[standard]",
]
worker = [
  "crewai[a2a]",
  "a2a-sdk==0.3.26",
  "litellm",
  "openinference-instrumentation-crewai",
]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "pyright", "respx"]

[project.scripts]
treefleet = "treefleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "phase0: spike results", "phase1: skeleton, config, events", "phase2: git layer and proofs",
  "phase3: worker, MCP, A2A server", "phase4: orchestrator core", "phase5: guardrails, Jev, callbacks",
  "phase6: review loop and integration", "phase7: observability", "phase8: API and UI",
  "phase9: evaluation harness", "phase10: deployment", "phase11: demo and evidence",
  "live: calls real model or network APIs, excluded from the default gate",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv*", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["spikes", ".venv*", ".venv-orch", ".venv-worker"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
