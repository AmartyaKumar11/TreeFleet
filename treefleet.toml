# Cursor ids from `cursor-agent --list-models` on 2026-10-27. `trivial` maps to simple.

[models]
fast = "deepseek/deepseek-flash"
strong = "deepseek/deepseek-v4-pro"
default_worker = "router"
default = ""

[models.router]
default_tier = "moderate"
simple = "composer-2.5-fast"
moderate = "composer-2.5"
complex = "cursor-grok-4.6-high"

[cursor]
cli = "cursor-agent"
list_flag = "--list-models"
model_flag = "--model"
workspace_flag = "--workspace"
sandbox = "disabled"
flags = ["--print", "--output-format", "json", "--trust"]

[thresholds]
injection = 0.5
abusive = 0.5
on_topic = 0.3

[workers]
port_start = 9101
mcp_startup_s = 15

[paths]
worktree_windows = 'C:\wt'
worktree_other = "/tmp/tf-wt"
orchestrator_venv = ".venv-orch"
worker_venv = ".venv-worker"

# --saboteur TASK is a demo-only CLI flag. It is off unless you pass it.
# It appends an instruction to break an existing test. Do not use it for real work.

[pricing]
# DeepSeek off-peak cache-miss input, cache-hit input, and output. Peak is double.
# Fetched 2026-10-27 from https://api-docs.deepseek.com/quick_start/pricing
# Peak is Mon-Fri 01:00-04:00 and 06:00-10:00 UTC.
deepseek_flash_input_per_million = 0.15
deepseek_flash_cache_hit_per_million = 0.003
deepseek_flash_output_per_million = 0.6
# deepseek-v4-pro off-peak. Same source and fetch date.
deepseek_pro_input_per_million = 0.66
deepseek_pro_cache_hit_per_million = 0.022
deepseek_pro_output_per_million = 1.98
# Composer 2.5 additional-usage rates. API-equivalent, labeled estimate.
# Fetched 2026-10-27 from https://cursor.com/docs/models
# Cache write is listed as "-" and is not priced.
cursor_composer_input_per_million = 0.5
cursor_composer_cache_read_per_million = 0.2
cursor_composer_output_per_million = 2.5
# Composer 2.5 (Fast). Same source and fetch date. estimate.
cursor_composer_fast_input_per_million = 3
cursor_composer_fast_cache_read_per_million = 0.5
cursor_composer_fast_output_per_million = 15
# cursor-grok-4.6-high is not on that page (Grok 4.6 is listed, the "high" id is not). Rate unset.
litellm_url = "https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json"
jev_usd_per_million_input = 0.042
jev_source_url = "https://api.typesafe.ai/v1/systemone"
