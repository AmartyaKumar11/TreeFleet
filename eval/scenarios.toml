# Machine-checked scenarios. Live runs use these goals and flags with no retries.

[[scenario]]
id = "E1"
goal = "Add one sentence to README.md that mentions pull requests."
flags = ["--yes", "--no-approval"]
repeat = 1

[scenario.expect]
guard = "allow"
task_min = 1
task_max = 2
statuses = ["done"]
verdicts = ["approve"]
isolation = "PASS"
checks = "pass"

[[scenario]]
id = "E2"
