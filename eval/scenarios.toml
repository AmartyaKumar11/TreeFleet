flags = ["--yes", "--no-approval"]
repeat = 2

[scenario.expect]
guard = "allow"
task_min = 3
task_max = 3
statuses = ["done"]
verdicts = ["approve"]
isolation = "PASS"
checks = "pass"

[[scenario]]
id = "E3"
goal = "Add unit tests for the notifications module and the admin module, and document the exported types in the TypeScript client."
flags = ["--yes", "--no-approval", "--saboteur", "notifications-tests"]
repeat = 1

[scenario.expect]
guard = "allow"
task_min = 3
task_max = 3
statuses = ["done", "failed"]
verdicts = ["approve", "reject"]
isolation = "PASS"
checks = "pass"
cover = true

